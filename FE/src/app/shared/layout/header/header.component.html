<header class="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(45,36,34,0.05)]">
  <div class="h-20 max-w-[1280px] mx-auto px-gutter flex items-center justify-between gap-space-md">
    <!-- Logo & Title -->
    <a class="flex items-center gap-space-sm group" data-path="kham-pha" href="#">
      <div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
        <span class="material-symbols-outlined text-on-primary-container text-[22px]"><i class="fa-solid fa-utensils"></i></span>
      </div>
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm text-on-surface leading-tight tracking-tight">
          DaNang <span class="text-primary">Food Guide</span>
        </span>
        <span class="font-label-xs text-label-xs text-tertiary uppercase tracking-wider">Ẩm Thực Đà Nẵng</span>
      </div>
    </a>

    <!-- Navigation Menu -->
    <nav class="hidden xl:flex items-center gap-space-xs p-1 bg-surface-container-low/60 rounded-full" data-active-classes="bg-surface-container text-primary font-title-md">
      <a aria-current="page" class="px-space-md py-space-sm rounded-full transition-all bg-surface-container text-primary font-title-md" data-path="kham-pha" routerLink="/home">Khám phá</a>
      <a class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" data-path="goi-y-cho-toi" routerLink="/food-search">Gợi ý cho tôi</a>
      <a class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" data-path="ban-do" routerLink="#">Bản đồ</a>
      <a class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" data-path="lo-trinh" routerLink="#">Lộ trình</a>
      <a class="px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all" data-path="cam-nang" routerLink="#">Cẩm nang</a>
    </nav>

    <!-- User Actions & Language Switcher -->
    <div class="flex items-center gap-space-sm">
      <!-- Language Switcher -->
      <div class="flex items-center bg-surface-container-low px-space-sm py-1 rounded-full text-label-md font-label-md">
        <button
          (click)="switchLanguage('VIE')"
          [class.font-bold]="currentLang === 'VIE'"
          [class.text-primary]="currentLang === 'VIE'"
          [class.text-on-surface-variant]="currentLang !== 'VIE'"
          class="px-space-xs py-0.5 rounded-full transition-colors"
          type="button">
          VIE
        </button>
        <span class="text-outline-variant px-0.5">/</span>
        <button
          (click)="switchLanguage('ENG')"
          [class.font-bold]="currentLang === 'ENG'"
          [class.text-primary]="currentLang === 'ENG'"
          [class.text-on-surface-variant]="currentLang !== 'ENG'"
          class="hover:text-on-surface px-space-xs py-0.5 rounded-full transition-colors"
          type="button">
          ENG
        </button>
      </div>

      <!-- Auth Buttons -->
      <a class="hidden sm:inline-flex items-center justify-center px-space-md py-space-sm rounded-full font-label-lg text-label-lg text-on-surface hover:text-primary hover:bg-surface-container-low transition-colors" data-path="dang-nhap" routerLink="auth/login">Đăng nhập</a>
      <a class="inline-flex items-center justify-center px-space-lg py-space-sm rounded-full font-label-lg text-label-lg bg-primary text-on-primary hover:bg-primary-container shadow-sm transition-all" data-path="dang-ky" routerLink="auth/register">Đăng ký</a>

      <!-- User Avatar Placeholder -->
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center ml-space-xs">
        <span class="material-symbols-outlined text-on-primary text-[18px]"><i class="fa-solid fa-user"></i></span>
      </div>
    </div>
  </div>
</header>
